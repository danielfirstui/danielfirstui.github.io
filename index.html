*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}

header.scrolled{background:rgba(15,23,42,.95);backdrop-filter:blur(8px);box-shadow:0 4px 20px rgba(0,0,0,.3)}
.header-inner{max-width:1200px;margin:0 auto;padding:0 24px;height:100%;display:flex;align-items:center;justify-content:space-between}
.brand{color:#fff;font-weight:700;font-size:18px;letter-spacing:-.02em}
nav.desktop{display:flex;gap:32px}
nav.desktop button{background:none;border:none;color:var(--txt2);font-size:14px;font-weight:500;cursor:pointer;transition:color .2s;font-family:inherit}
nav.desktop button:hover{color:#fff}
.langs{display:flex;align-items:center;gap:4px;font-size:14px}
.langs .sep{color:#475569;margin:0 4px}
.langs button{background:none;border:none;color:var(--txt2);font-weight:500;cursor:pointer;font-family:inherit;font-size:14px;transition:color .2s;padding:4px 2px}

.cta:active{transform:translateY(0)}
.cta.large{padding:20px 40px;font-size:20px}
.cta.medium{padding:16px 32px;font-size:18px}
.cta svg{width:24px;height:24px;flex-shrink:0}
.cta.full{width:100%}

section.alt{background:var(--bg2)}

.step{text-align:center}
.step-num{width:64px;height:64px;border-radius:50%;background:rgba(34,197,94,.15);border:2px solid var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:24px;font-weight:700;color:#4ADE80}

const NAV_ITEMS = [
  {key:'howItWorks', href:'#cum-functioneaza'},
  {key:'pricing', href:'#pricing'},

  {key:'faq', href:'#faq'},

];

const WA = 'https://wa.me/40752562503';

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

function render(lang){
  const t = T[lang];
  // Simple text bindings
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const path = el.getAttribute('data-i18n').split('.');
    let v = t;
    path.forEach(k=>{v = v ? v[k] : undefined});
    if(typeof v === 'string') el.textContent = v;
  });
  // Nav
  const navBtns = NAV_ITEMS.map(n=>`<button data-href="${n.href}">${esc(t.nav[n.key])}</button>`).join('');
  document.getElementById('navDesktop').innerHTML = navBtns;
  document.getElementById('mobileMenu').innerHTML = navBtns;
  // Steps
  document.getElementById('steps').innerHTML = t.howItWorks.steps.map(s=>
    `<div class="step"><div class="step-num">${s.number}</div><h3>${esc(s.title)}</h3><p>${esc(s.description)}</p></div>`
  ).join('');
  // Routes
  document.getElementById('routes').innerHTML = t.pricing.routes.map(r=>
    `<div class="route"><div><h3>${esc(r.name)}</h3><p class="pers">${esc(t.pricing.passengers)}</p></div><div class="price">${esc(r.price)}</div></div>`
  ).join('');
  // Custom note
  document.getElementById('customNote').innerHTML =
    esc(t.pricing.customNotePre) + `<a href="${WA}" target="_blank" rel="noopener noreferrer">WhatsApp</a>` + esc(t.pricing.customNotePost);
  // Destinations
  document.getElementById('destGrid').innerHTML = t.destinations.items.map(d=>
    `<div class="dest-card"><h3>${esc(d.name)}</h3><p>${esc(d.description)}</p></div>`
  ).join('');
  // Features
  document.getElementById('features').innerHTML = t.vehicle.features.map(f=>
    `<div class="feature"><span class="ic">${f.icon}</span><p>${esc(f.text)}</p></div>`
  ).join('');
  // Why cards
  document.getElementById('whyGrid').innerHTML = t.whyUs.cards.map(c=>
    `<div class="why-card"><div class="ic">${c.icon}</div><h3>${esc(c.title)}</h3><p>${esc(c.description)}</p></div>`
  ).join('');
  // FAQ
  document.getElementById('faqList').innerHTML = t.faq.items.map(f=>
    `<div class="faq-item" itemscope itemtype="https://schema.org/Question"><h3 itemprop="name">${esc(f.question)}</h3><div itemscope itemprop="acceptedAnswer" itemtype="https://schema.org/Answer"><p itemprop="text">${esc(f.answer)}</p></div></div>`
  ).join('');
  // SEO meta
  document.title = t.seo.title;
  setMeta('name','description',t.seo.description);
  setMeta('property','og:title',t.seo.ogTitle);
  setMeta('property','og:description',t.seo.ogDescription);
  setMeta('property','og:locale',t.seo.ogLocale);
  setMeta('name','twitter:title',t.seo.ogTitle);
  setMeta('name','twitter:description',t.seo.ogDescription);
  document.documentElement.lang = lang;
  // Lang buttons
  document.querySelectorAll('.langs button').forEach(b=>{
    b.classList.toggle('active', b.getAttribute('data-lang')===lang);
  });
  // Nav click handlers
  document.querySelectorAll('nav button, .mobile-menu button').forEach(b=>{
    b.addEventListener('click', ()=>{
      const target = document.querySelector(b.getAttribute('data-href'));
      if(target) target.scrollIntoView({behavior:'smooth'});
      document.getElementById('mobileMenu').classList.remove('open');
    });
  });
}

function setMeta(attr,key,content){
  let el = document.querySelector(`meta[${attr}="${key}"]`);
  if(el) el.setAttribute('content',content);
}

function setLang(lang){
  if(!T[lang]) lang = 'ro';
  localStorage.setItem('lang', lang);
  render(lang);
}

// Init
document.querySelectorAll('.langs button').forEach(b=>{
  b.addEventListener('click', ()=> setLang(b.getAttribute('data-lang')));
});
document.getElementById('burger').addEventListener('click', ()=>{
  document.getElementById('mobileMenu').classList.toggle('open');
});
window.addEventListener('scroll', ()=>{
  document.getElementById('header').classList.toggle('scrolled', window.scrollY > 50);
}, {passive:true});

// Start: saved language or Romanian default
const saved = localStorage.getItem('lang');
render(saved && T[saved] ? saved : 'ro');
</script>
